# The aggregator runs as its OWN compose project, separate from the main stack
# (docker-compose.yml). Why split it out:
#   * A long uninterrupted run has been seen to climb toward 100% CPU. As its
#     own project with a `cpus` cap, a runaway can only take one core -- the
#     NAS and the other bots stay responsive -- and you can restart JUST the
#     aggregator without touching anything else.
#   * It updates independently: the main stack's `compose down` never removes
#     this container (different project), and vice versa.
#
# It is a Telethon USER account (not a bot-token minion) -- the only kind that
# may send premium emoji. It rides the ONE shared image (telethon is baked in
# via the pyproject `tg` extra), so there is nothing extra to build.
#
# Config lives in .env: SOURCE_CHAT_ID, TARGET_CHAT_ID (comma-separated for
# several chats), TELEGRAM_API_ID / TELEGRAM_API_HASH (my.telegram.org). The
# session is a FILE on the shared /data mount, so a one-time login survives
# restarts and shutdowns.
#
# Deploy / update (nas-update.sh does this for you, as its own project):
#   docker compose -p minion2-agg -f docker-compose.aggregator.yml pull
#   docker compose -p minion2-agg -f docker-compose.aggregator.yml up -d
# First login (once):
#   docker compose -p minion2-agg -f docker-compose.aggregator.yml \
#     run --rm aggregator
# Restart just the aggregator (e.g. to clear a slow CPU climb):
#   docker restart minion2-agg-aggregator-1
services:
  aggregator:
    image: ghcr.io/coppermilk/minion2:latest
    pull_policy: missing
    env_file: .env
    environment:
      DRIVE: /data
      TELEGRAM_SESSION_FILE: /data/bots/aggregator/telethon
      AGGREGATOR_STATE_DIR: /data/bots/aggregator
    volumes:
      - ${DRIVE_NAS}:/data
    command: python -m minions.aggregator.main
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The isolation knob: even a runaway can use at most one core, so 100% CPU
    # here never freezes the NAS. mem_limit stays modest; a memory leak OOMs
    # and the restart policy brings it back clean.
    cpus: 1.0
    mem_limit: 256m
    # No tty/stdin here: a TTY blanks Synology Container Manager's Log tab. The
    # one-time login uses `... run --rm aggregator`, which gets its own TTY.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
