# Bananaland build + the law block (BLUEPRINT 4, 15.1).
#
# Waiver register (BLUEPRINT 12): every global ignore below carries its
# written reason; anything narrower lives in per-file-ignores or an
# inline `noqa` with a reason at the site.

[build-system]
requires = ['setuptools>=69']
build-backend = 'setuptools.build_meta'

[project]
name = 'bananaland'
version = '1.0.0'
description = 'Personal media pipeline: two transports in, one tree out.'
readme = 'README.md'
# Waiver: BLUEPRINT targets Python 3.14; 3.11 is the floor so the suite
# runs on present interpreters. The code uses no post-3.11 syntax.
requires-python = '>=3.11'
dependencies = [
    'requests>=2.32',
    'Pillow>=10.0',
    'piexif>=1.1',
    'numpy>=1.26',
    # typing.override landed in 3.12; on the 3.11 floor it comes from
    # the backport, so an override stays a declared override, not a noqa.
    'typing_extensions>=4.4; python_version < "3.12"',
]

[project.optional-dependencies]
# Heavy vendors stay optional: lazy imports keep bots and the test
# suite runnable without them (BLUEPRINT 6, Power-of-10 rule 3).
ml = ['torch', 'torchvision', 'transformers', 'facenet-pytorch']
llm = ['google-genai']
links = ['yt-dlp']
# The aggregator userbot (minions/userbot): a Telethon USER account is the
# only kind that may send premium emoji. Baked into the one shared image.
tg = ['telethon>=1.36,<2']
dev = [
    'pytest>=8',
    'ruff>=0.8',
    'mypy>=1.13',
    'types-requests',
    'build',
]

[tool.setuptools.packages.find]
include = ['minion_core*', 'minions*']

[tool.setuptools.package-data]
minion_core = ['py.typed', 'prompts/*.md']
# The donations bot's Russian alert templates: UTF-8, deliberately not
# an ASCII-checked source (BLUEPRINT 4), shipped with the wheel.
'minions.bots.donations' = ['messages.json']
# The wishlist bot's Russian thank-you template: same rationale.
'minions.bots.wishlist' = ['messages.json']
# The aggregator's editable post constants (UTF-8 texts + premium emoji ids),
# the cabinet ("/comod") template photo (assets/), and the shelf-label font
# (assets/fonts/): Liberation Serif Bold Italic (Latin + Cyrillic).
'minions.userbot' = [
    'aggregator_constants.json',
    'assets/*',
    'assets/fonts/*',
]
# The donate userbot's editable shout-out texts + the leading premium emoji.
'minions.donate' = ['donate_constants.json']

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    # The only waivers left are rule pairs that cannot both be satisfied --
    # nothing here is a style preference, each is a true contradiction.
    #
    # COM812 (trailing comma) / ISC001 (implicit string concat): the ruff
    # formatter is a CI gate, and enforcing either fights it -- COM812 adds
    # a comma the formatter then explodes across lines, so the two never
    # reach a fixed point. Ruff itself documents them as formatter-off.
    'COM812',
    'ISC001',
    # D203 (1 blank line before a class docstring) vs D211 (0), and D213
    # (summary on line 2) vs D212 (line 1): mutually exclusive by definition
    # -- a line cannot be both blank and not. pep257 convention picks
    # D211/D212, so its opposite is un-satisfiable and stays off.
    'D203',
    'D213',
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 3

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint.per-file-ignores]
# Each entry waives a rule that does not apply to a whole class of file --
# the rule targets something that IS the medium here, or measures the
# wrong thing -- not a rule someone declined to satisfy.
#
# Lazy vendor loads (Power-of-10 rule 8): adapters and svc-* Steps own a
# heavy, OPTIONAL model (torch, facenet) and import it inside the function
# that uses it, so the module still imports -- and the bot still degrades
# cleanly (REQ-DEG-001) -- when the vendor is absent. A top-level import
# cannot do that, so PLC0415 is un-satisfiable here by design.
'minion_core/adapters/*' = ['PLC0415']
'minions/svc/*/step.py' = ['PLC0415']
'services/*' = ['PLC0415']
# create_app registers its route handlers inline; McCabe counts each as a
# branch, so its score is route count, not real nesting -- a metric misfit.
'services/http.py' = ['PLC0415', 'C901']
# Files that drive a fixed external binary: S603 flags every subprocess call,
# but the argv is a constant (yt-dlp, ffmpeg, the print spooler) -- never a
# shell, never caller input. Subprocess IS the medium of these boundaries.
'minion_core/adapters/fetch.py' = ['S603']
'minion_core/adapters/video.py' = ['S603']
'minions/bots/print/main.py' = ['S603']
# Tests are pytest tooling, so these rules target what IS the medium here:
# S101 (assert is how pytest checks), S311 (a seeded PRNG is the
# deterministic-fixture medium, never crypto), SLF001 (white-box tests read
# internals on purpose), ARG (a test double must match a signature it does
# not use), PLC0415 (the same lazy-vendor loads). Everything else --
# docstrings, annotations, named constants -- is satisfied in the tests.
'tests/*' = ['S101', 'S311', 'SLF001', 'ARG', 'PLC0415', 'S106']
'services/tests/*' = ['S101', 'ARG', 'PLC0415']
# Operator CLIs whose stdout IS the product: login.py prints where it wrote
# the session file; dump_emoji_ids.py prints each premium emoji id;
# cats_proof.py's printed narration is the deliverable. T201 (no print)
# targets stray debug prints in library code, not a tool's own output.
'minions/userbot/login.py' = ['T201']
'minions/userbot/dev/dump_emoji_ids.py' = ['T201']
'minions/userbot/dev/reactions_proof.py' = ['T201']
'minions/donate/login.py' = ['T201']

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
packages = ['minion_core', 'minions']
# Waiver: the package floor is 3.11, but numpy >= 2.5 ships PEP 695
# `type` statements in its stubs, which mypy only parses at a 3.12+
# target. The code itself uses no post-3.11 syntax (ruff enforces).
python_version = '3.12'

[[tool.mypy.overrides]]
# Waiver: untyped / optional vendors behind adapters; each is the sole
# import site per REQ-ARC-002, so the unchecked surface is one file.
module = [
    'piexif',
    'yt_dlp.*',
    'torch.*',
    'torchvision.*',
    'transformers.*',
    'facenet_pytorch.*',
    'google.*',
    # Telethon ships no stubs. It is imported at exactly one site
    # (minion_core/adapters/userchat.py, enforced by test_architecture),
    # so the unchecked surface is that file's vendor calls -- everything
    # above it deals in this project's own value types.
    'telethon.*',
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The services tier carries its own web stack (fastapi, uvicorn, mcp) and its
# own lighter conventions -- it is not part of the kernel's strict gate
# (packages above are minion_core + minions). Each minion's service.py imports
# its serve helper, so tell mypy not to follow into the services package (its
# deps are not installed for the kernel gate). It is linted by ruff and proven
# by services/tests.
module = ['services.*']
follow_imports = 'skip'
ignore_missing_imports = true

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q'
# The suite imports its own helpers as `tests.conftest`; put the
# repo root on sys.path regardless of how pytest is invoked (bare
# `pytest` in CI vs `python -m pytest` locally).
pythonpath = ['.']
